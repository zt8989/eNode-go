name: macOS CI

on:
#  push:
#    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

#      - name: Run tests (unit only)
#        run: go test ./...

      - name: Get version
        run: echo "APP_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          OUT="dist/enode-v${APP_VERSION}-macos-arm64"
          mkdir -p "$OUT"
          for c in enode natsim1 natsim2; do
            go build -trimpath -ldflags="-s -w" -o "$OUT/$c" "./cmd/$c"
          done

      - name: Bundle
        run: |
          OUT="dist/enode-v${APP_VERSION}-macos-arm64"
          cp enode.config.yaml README.md MIT-LICENSE.txt "$OUT/"
          tar -C dist -czf "$OUT.tar.gz" "enode-v${APP_VERSION}-macos-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: enode-v${{ env.APP_VERSION }}-macos-arm64
          path: dist/enode-v*-macos-arm64.tar.gz
