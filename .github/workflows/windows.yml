name: Windows CI

on:
#  push:
#    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

#      - name: Run tests (unit only)
#        run: go test ./...

      - name: Get version
        shell: pwsh
        run: echo "APP_VERSION=$(git describe --tags --always --dirty)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $out = "dist/enode-v$env:APP_VERSION-win64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($c in "enode","natsim1","natsim2") {
            go build -trimpath -ldflags="-s -w" -o "$out/$c.exe" "./cmd/$c"
          }

      - name: Bundle
        shell: pwsh
        run: |
          $out = "dist/enode-v$env:APP_VERSION-win64"
          Copy-Item enode.config.yaml,README.md,MIT-LICENSE.txt $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: enode-v${{ env.APP_VERSION }}-win64
          path: dist/enode-v*-win64.zip
